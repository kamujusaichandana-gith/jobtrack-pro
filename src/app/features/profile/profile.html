<section class="profile-page">
	<header class="page-heading">
		<p class="eyebrow">YOUR ACCOUNT</p>
		<h1>Profile</h1>
		<p class="heading-note">Keep your professional details up to date.</p>
	</header>

	<form class="profile-card" (ngSubmit)="saveProfile()">
		<div class="card-heading">
			<span class="profile-avatar" aria-hidden="true">
				{{ profile.fullName.slice(0, 1) || 'U' }}
			</span>
			<div>
				<h2>Personal details</h2>
				<p>Manage the details associated with your account.</p>
			</div>
		</div>

		<div class="profile-fields">
			<div class="form-group">
				<label for="fullName">Full Name</label>
				<input id="fullName" name="fullName" type="text" [(ngModel)]="profile.fullName" required>
			</div>
			<div class="form-group">
				<label for="email">Email</label>
				<input id="email" name="email" type="email" [(ngModel)]="profile.email" required>
			</div>
			<div class="form-group">
				<label for="jobTitle">Job Title</label>
				<input id="jobTitle" name="jobTitle" type="text" [(ngModel)]="profile.jobTitle" required>
			</div>
			<div class="form-group">
				<label for="location">Location</label>
				<input id="location" name="location" type="text" [(ngModel)]="profile.location" required>
			</div>
		</div>

		<div class="form-actions">
			<p class="save-message" role="status" aria-live="polite">
				@if (saved) {
					Profile saved successfully.
				}
			</p>
			<button type="submit">Save Profile</button>
		</div>
	</form>
</section>
